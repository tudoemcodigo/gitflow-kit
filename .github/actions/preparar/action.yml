name: gitflow-preparar
description: Prepara o job do GitFlow Kit (token do App opcional, checkout da aplicacao e variaveis do kit). O kit ja deve estar em .gitflow.
inputs:
  token:
    description: "'true' gera o token do GitHub App (so para jobs que escrevem no repositorio)"
    default: 'false'
  app-id:
    description: ID do GitHub App (so com token true)
    default: ''
  app-key:
    description: Chave privada do GitHub App (so com token true)
    default: ''
  ref:
    description: Ref da aplicacao a baixar (vazio = branch padrao)
    default: ''
runs:
  using: composite
  steps:
    - id: repo
      if: inputs.token == 'true'
      shell: bash
      env:
        REPO: ${{ github.repository }}
      run: echo "nome=${REPO#*/}" >> "$GITHUB_OUTPUT"
    - id: app
      if: inputs.token == 'true'
      uses: actions/create-github-app-token@v1
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.app-key }}
        owner: ${{ github.repository_owner }}
        repositories: ${{ steps.repo.outputs.nome }}
    - uses: actions/checkout@v4
      with:
        path: app
        ref: ${{ inputs.ref }}
        fetch-depth: 0
        fetch-tags: true
        persist-credentials: false
        token: ${{ steps.app.outputs.token || github.token }}
    - name: Variaveis do kit
      shell: bash
      env:
        APP_TOKEN: ${{ steps.app.outputs.token }}
        APP_SLUG: ${{ steps.app.outputs.app-slug }}
        EVENTO: ${{ github.event_name }}
        ATOR: ${{ github.triggering_actor }}
        RUN_ID: ${{ github.run_id }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
        AREA: ${{ github.workspace }}
        TEMP_DIR: ${{ runner.temp }}
      run: |
        set -eu
        mkdir -p "$TEMP_DIR/gitflow"
        QUEM=$ATOR
        if [ "$EVENTO" = schedule ]; then QUEM=timer; fi
        EMAIL=
        if [ -n "$APP_TOKEN" ]; then
          echo "::add-mask::$APP_TOKEN"
          # identidade dos commits/tags = o bot do App (<slug>[bot])
          BID=$(curl -fsS -H "Authorization: Bearer $APP_TOKEN" -H 'Accept: application/vnd.github+json' \
            "${GITHUB_API_URL:-https://api.github.com}/users/${APP_SLUG}%5Bbot%5D" | jq -r '.id // empty') || BID=
          if [ -n "$BID" ]; then EMAIL="${BID}+${APP_SLUG}[bot]@users.noreply.github.com"; else EMAIL="${APP_SLUG}[bot]@users.noreply.github.com"; fi
        fi
        {
          # so run_id: "Re-run failed jobs" mantem o dono dos locks (a tentativa vai em GITFLOW_RUN_URL)
          echo "GITFLOW_RUN_ID=${RUN_ID}"
          echo "GITFLOW_RUN_URL=$RUN_URL"
          echo "GITFLOW_SAIDA=$TEMP_DIR/gitflow"
          echo "GITFLOW_PROVIDER=github"
          echo "BUILD_USER_ID=$QUEM"
          echo "KIT_DIR=$AREA/.gitflow"
          if [ -n "$APP_TOKEN" ]; then echo "GITHUB_TOKEN=$APP_TOKEN"; fi
          if [ -n "$EMAIL" ]; then
            echo "BOT_EMAIL=$EMAIL"
            echo "BOT_NAME=${APP_SLUG}[bot]"
            echo "GIT_AUTHOR_NAME=${APP_SLUG}[bot]"
            echo "GIT_COMMITTER_NAME=${APP_SLUG}[bot]"
            echo "GIT_AUTHOR_EMAIL=$EMAIL"
            echo "GIT_COMMITTER_EMAIL=$EMAIL"
          fi
          if [ -n "$APP_TOKEN" ]; then
            # credencial do git so por ambiente (nada gravado em .git/config)
            B64=$(printf 'x-access-token:%s' "$APP_TOKEN" | base64 | tr -d '\n')
            echo "::add-mask::$B64"
            echo "GIT_CONFIG_COUNT=1"
            echo "GIT_CONFIG_KEY_0=http.extraHeader"
            echo "GIT_CONFIG_VALUE_0=AUTHORIZATION: basic $B64"
          fi
        } >> "$GITHUB_ENV"
