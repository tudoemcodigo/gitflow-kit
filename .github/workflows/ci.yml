name: ci
on:
  push:
  pull_request:
jobs:
  testes:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: shellcheck
        run: |
          files=$(find core adapters ci -name '*.sh' 2>/dev/null || true)
          if [ -n "$files" ]; then
            # shellcheck disable=SC2086
            shellcheck $files
          fi
      - name: instalar actionlint 1.7.7 (checksum fixado)
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP"
          curl -fsSLO https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          echo '023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  actionlint_1.7.7_linux_amd64.tar.gz' | sha256sum -c -
          tar -xzf actionlint_1.7.7_linux_amd64.tar.gz -C "$RUNNER_TEMP/bin" actionlint
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: actionlint
        if: matrix.os == 'ubuntu-latest'
        run: actionlint .github/workflows/*.yml ci/github-actions/chamadores/*.yml
      - name: bats
        run: tests/bats/bats-core/bin/bats tests/
