name: ci
on:
  push:
  pull_request:
jobs:
  testes:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: shellcheck
        run: |
          files=$(find core adapters -name '*.sh' 2>/dev/null || true)
          if [ -n "$files" ]; then
            # shellcheck disable=SC2086
            shellcheck $files
          fi
      - name: bats
        run: tests/bats/bats-core/bin/bats tests/
